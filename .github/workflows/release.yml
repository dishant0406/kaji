name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (format: X.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: Kaji
  ARCH: arm64
  REPOSITORY_SLUG: ${{ github.repository }}
  TAP_REPOSITORY: dishant0406/homebrew-kaji
  TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GH_PAT }}

jobs:
  build-deps:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GH_PAT || github.token }}

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Install GhosttyKit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_PAT || github.token }}
        run: |
          EXPECTED_STAMP="$(cat .ghostty-source)"
          CACHE_DIR="$(mktemp -d)"
          trap 'rm -rf "$CACHE_DIR"' EXIT
          if gh release download ghosttykit-cache \
            --repo "$REPOSITORY_SLUG" \
            --pattern "GhosttyKit.xcframework.zip" \
            --dir "$CACHE_DIR" \
            --clobber; then
            unzip -oq "$CACHE_DIR/GhosttyKit.xcframework.zip" -d "$CACHE_DIR"
            if [[ -d "$CACHE_DIR/GhosttyKit.xcframework" && -f "$CACHE_DIR/.ghostty-source" && "$(cat "$CACHE_DIR/.ghostty-source")" == "$EXPECTED_STAMP" ]]; then
              rm -rf GhosttyKit.xcframework
              cp -R "$CACHE_DIR/GhosttyKit.xcframework" GhosttyKit.xcframework
              exit 0
            fi
            echo "Cached GhosttyKit does not match .ghostty-source; rebuilding from source"
          else
            echo "Cached GhosttyKit is unavailable; rebuilding from source"
          fi
          rm -rf GhosttyKit.xcframework
          scripts/setup.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build native dependencies
        run: |
          chmod +x scripts/install-cef-runtime.sh scripts/build-parent-agent.sh scripts/build-kaji-agent-runtime.sh scripts/build-zlob.sh
          scripts/install-cef-runtime.sh --arch "$ARCH"
          scripts/build-parent-agent.sh
          scripts/build-kaji-agent-runtime.sh
          scripts/build-zlob.sh

      - name: Upload native dependencies
        uses: actions/upload-artifact@v4
        with:
          name: native-deps
          path: |
            GhosttyKit.xcframework/

            GhosttyKit/ghostty.h
            .dev-support/cef-runtime/
            Kaji/Resources/KajiAgentRuntime/kaji-agent-runtime.mjs
            Kaji/Resources/pi/kaji-agent.mjs
            Kaji/Resources/pi/oauth-login.mjs
            Kaji/Resources/Zlob/zlob
          retention-days: 1

  release:
    needs: build-deps
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GH_PAT || github.token }}

      - name: Validate version
        id: validate
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in X.Y.Z format"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Version app bundle metadata
        id: version
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + 1 ))
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Kaji/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Kaji/Info.plist
          if ! git diff --quiet -- Kaji/Info.plist; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Kaji/Info.plist
            git commit -m "Release $VERSION"
            git push
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Download native dependencies
        uses: actions/download-artifact@v4
        with:
          name: native-deps

      - name: Restore native dependency paths
        run: |
          echo "Verifying native dependencies..."
          ls -la GhosttyKit.xcframework/ 2>/dev/null || echo "WARNING: GhosttyKit.xcframework missing"
          ls -la .dev-support/cef-runtime/ 2>/dev/null || echo "WARNING: CEF runtime missing"
          ls -la Kaji/Resources/KajiAgentRuntime/kaji-agent-runtime.mjs 2>/dev/null || echo "WARNING: agent runtime missing"
          ls -la Kaji/Resources/pi/kaji-agent.mjs 2>/dev/null || echo "WARNING: parent agent missing"
          ls -la Kaji/Resources/Zlob/zlob 2>/dev/null || echo "WARNING: zlob missing"

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Install create-dmg
        run: npm install --global create-dmg

      - name: Build unsigned DMG
        run: |
          chmod +x scripts/build-release.sh scripts/create-icns.sh
          scripts/build-release.sh \
            --arch "$ARCH" \
            --version "${{ steps.validate.outputs.version }}" \
            --skip-native-deps \
            --smoke-launch

      - name: Verify and checksum DMG
        id: dmg
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          DMG_PATH="build/${APP_NAME}-${VERSION}-${ARCH}.dmg"
          hdiutil verify "$DMG_PATH" >/dev/null
          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_PAT || github.token }}
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          TAG="v$VERSION"
          NOTES=$(cat <<'EOF'
          - Adds native agent instruction viewing.
          - Adds configurable footer terminal.
          - Fixes parent agent subagent output capture.
          EOF
          )
          if gh release view "$TAG" --repo "$REPOSITORY_SLUG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.dmg.outputs.path }}" --repo "$REPOSITORY_SLUG" --clobber
          else
            gh release create "$TAG" \
              "${{ steps.dmg.outputs.path }}" \
              --repo "$REPOSITORY_SLUG" \
              --target "$(git rev-parse HEAD)" \
              --title "${APP_NAME} $VERSION" \
              --notes "$NOTES"
          fi

      - name: Update Homebrew cask
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.TAP_TOKEN }}
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          SHA256="${{ steps.dmg.outputs.sha256 }}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPOSITORY}.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/kajikit.rb <<EOF
          cask "kajikit" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/${REPOSITORY_SLUG}/releases/download/v#{version}/${APP_NAME}-#{version}-${ARCH}.dmg"
            name "${APP_NAME}"
            desc "macOS terminal multiplexer for AI coding agents"
            homepage "https://github.com/${REPOSITORY_SLUG}"

            depends_on macos: ">= :sonoma"

            app "${APP_NAME}.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/${APP_NAME}.app"],
                             sudo: false
            end

            caveats <<~EOS
              ${APP_NAME} is currently distributed as an unsigned developer preview.

              This cask removes the macOS quarantine attribute after install so ${APP_NAME} can launch.
              Managed or corporate Macs may still block unsigned apps.
            EOS
          end
          EOF
          cat > tap/README.md <<EOF
          # homebrew-kaji
          Homebrew tap for ${APP_NAME}

          ## Install

          \`\`\`bash
          brew tap dishant0406/kaji
          brew install --cask kajikit
          \`\`\`

          ## Launch

          \`\`\`bash
          open /Applications/${APP_NAME}.app
          \`\`\`
          EOF
          cd tap
          ruby -c Casks/kajikit.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md Casks/kajikit.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update KajiKit to $VERSION"
            git push
          fi

      - name: Skip Homebrew cask update
        if: env.TAP_TOKEN == ''
        run: |
          echo "Skipping Homebrew cask update because HOMEBREW_TAP_TOKEN or GH_PAT is not configured."
