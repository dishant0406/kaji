name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (format: X.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: Droid
  ARCH: arm64
  REPOSITORY_SLUG: ${{ github.repository }}
  TAP_REPOSITORY: dishant0406/homebrew-droid

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: validate
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in X.Y.Z format"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Version app bundle metadata
        id: version
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + 1 ))
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Droid/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Droid/Info.plist
          if ! git diff --quiet -- Droid/Info.plist; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Droid/Info.plist
            git commit -m "Release $VERSION"
            git push
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Install cached GhosttyKit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ghosttykit-cache \
            --repo "$REPOSITORY_SLUG" \
            --pattern "GhosttyKit.xcframework.zip" \
            --clobber
          unzip -q GhosttyKit.xcframework.zip

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Install create-dmg
        run: npm install --global create-dmg

      - name: Build unsigned DMG
        run: |
          chmod +x scripts/build-parent-agent.sh scripts/build-release.sh scripts/create-icns.sh
          scripts/build-release.sh \
            --arch "$ARCH" \
            --version "${{ steps.validate.outputs.version }}"

      - name: Verify and checksum DMG
        id: dmg
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          DMG_PATH="build/${APP_NAME}-${VERSION}-${ARCH}.dmg"
          hdiutil verify "$DMG_PATH" >/dev/null
          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          TAG="v$VERSION"
          NOTES=$(cat <<'EOF'
          - Adds native agent instruction viewing.
          - Adds configurable footer terminal.
          - Fixes parent agent subagent output capture.
          EOF
          )
          if gh release view "$TAG" --repo "$REPOSITORY_SLUG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.dmg.outputs.path }}" --repo "$REPOSITORY_SLUG" --clobber
          else
            gh release create "$TAG" \
              "${{ steps.dmg.outputs.path }}" \
              --repo "$REPOSITORY_SLUG" \
              --target "$(git rev-parse HEAD)" \
              --title "${APP_NAME} $VERSION" \
              --notes "$NOTES"
          fi

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GH_PAT || github.token }}
        run: |
          VERSION="${{ steps.validate.outputs.version }}"
          SHA256="${{ steps.dmg.outputs.sha256 }}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPOSITORY}.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/droidkit.rb <<EOF
          cask "droidkit" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/${REPOSITORY_SLUG}/releases/download/v#{version}/${APP_NAME}-#{version}-${ARCH}.dmg"
            name "${APP_NAME}"
            desc "macOS terminal multiplexer for AI coding agents"
            homepage "https://github.com/${REPOSITORY_SLUG}"

            depends_on macos: ">= :sonoma"

            app "${APP_NAME}.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/${APP_NAME}.app"],
                             sudo: false
            end

            caveats <<~EOS
              ${APP_NAME} is currently distributed as an unsigned developer preview.

              This cask removes the macOS quarantine attribute after install so ${APP_NAME} can launch.
              Managed or corporate Macs may still block unsigned apps.
            EOS
          end
          EOF
          cat > tap/README.md <<EOF
          # homebrew-droid
          Homebrew tap for ${APP_NAME}

          ## Install

          \`\`\`bash
          brew tap dishant0406/droid
          brew install --cask droidkit
          \`\`\`

          ## Launch

          \`\`\`bash
          open /Applications/${APP_NAME}.app
          \`\`\`
          EOF
          cd tap
          ruby -c Casks/droidkit.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md Casks/droidkit.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update DroidKit to $VERSION"
            git push
          fi
